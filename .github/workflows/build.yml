name: Build Contract

on:
  workflow_call:
    inputs:
      package-version:
        description: NuGet package version to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Locate solution
        id: solution
        shell: bash
        run: |
          SOLUTION="$(find . -maxdepth 1 -type f -name '*.slnx' -print -quit)"

          if [[ -z "$SOLUTION" ]]; then
            echo "::error::No root-level .slnx solution found."
            exit 1
          fi

          echo "path=$SOLUTION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.solution.outputs.path }}"

      - name: Test
        run: dotnet test "${{ steps.solution.outputs.path }}" --configuration Release --no-restore

      - name: Pack Contract.Core
        run: |
          dotnet pack \
            contract/core/src/Amiasea.Enterprise.Contract.Core/Amiasea.Enterprise.Contract.Core.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts \
            -p:PackageVersion="${{ inputs.package-version }}"

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14
